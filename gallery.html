<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotomuur</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    background: #fbfbfd;
    color: #1d1d1f;
    -webkit-font-smoothing: antialiased;
  }
  nav {
    position: fixed; top: 0; width: 100%; height: 48px;
    display: flex; justify-content: center; gap: 40px; align-items: center;
    background: rgba(251,251,253,0.72);
    backdrop-filter: saturate(180%) blur(20px);
    z-index: 10; font-size: 13px;
  }
  nav a { color: #1d1d1f; text-decoration: none; opacity: 0.8; }
  nav a:hover, nav a.active { opacity: 1; font-weight: 600; }
  header {
    padding: 140px 24px 60px; text-align: center;
    background: radial-gradient(circle at 25% 20%, #ffd1dc 0%, transparent 50%),
                radial-gradient(circle at 75% 60%, #8ec5fc 0%, transparent 50%),
                #fbfbfd;
  }
  h1 { font-size: clamp(48px, 9vw, 104px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05;
       background: linear-gradient(90deg, #1d1d1f, #6e6e73); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { font-size: clamp(18px, 2.6vw, 28px); color: #6e6e73; margin-top: 16px; font-weight: 500; }
  .grid {
    max-width: 1100px; margin: 0 auto; padding: 40px 24px 100px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px;
  }
  .grid img {
    width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 24px; cursor: zoom-in;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    transition: transform .5s cubic-bezier(.2,.7,.2,1), box-shadow .5s;
  }
  .grid img:hover { transform: scale(1.03); box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
  .reveal { opacity: 0; transform: translateY(40px); transition: all 1s cubic-bezier(.2,.7,.2,1); }
  .reveal.show { opacity: 1; transform: none; }
  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.88); backdrop-filter: blur(10px);
    display: none; justify-content: center; align-items: center; z-index: 50; cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 92vw; max-height: 90vh; border-radius: 16px; }
  #music {
    position: fixed; right: 24px; bottom: 24px; width: 56px; height: 56px; border-radius: 50%;
    border: none; cursor: pointer; font-size: 22px; z-index: 20;
    background: rgba(255,255,255,0.8); backdrop-filter: blur(20px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.15); transition: transform .3s;
  }
  #music:hover { transform: scale(1.1); }
  footer { padding: 40px; text-align: center; color: #86868b; font-size: 13px; }
  #lock {
    position: fixed; inset: 0; z-index: 100; display: flex; justify-content: center; align-items: center;
    background: #0b0b14; overflow: hidden; padding: 24px;
    transition: opacity .8s ease, transform .8s ease;
  }
  #lock.done { opacity: 0; transform: scale(1.08); pointer-events: none; }
  .orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .75; will-change: transform; }
  .orb.o1 { width: 46vmax; height: 46vmax; background: #8e5cff; top: -12vmax; left: -10vmax; animation: float1 14s ease-in-out infinite; }
  .orb.o2 { width: 40vmax; height: 40vmax; background: #2fa8ff; bottom: -14vmax; right: -8vmax; animation: float2 17s ease-in-out infinite; }
  .orb.o3 { width: 32vmax; height: 32vmax; background: #ff5fa2; top: 30%; left: 40%; animation: float3 19s ease-in-out infinite; }
  @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(14vmax,10vmax) scale(1.15); } }
  @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-16vmax,-8vmax) scale(1.2); } }
  @keyframes float3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-10vmax,12vmax) scale(.85); } }
  .lock-card {
    position: relative; z-index: 2; width: min(380px, 100%); padding: 44px 32px; text-align: center;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); border-radius: 32px;
    backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%);
    box-shadow: 0 30px 80px rgba(0,0,0,0.4); color: #fff;
    animation: cardIn 1s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(30px) scale(.96); } to { opacity: 1; transform: none; } }
  .lock-card.shake { animation: shake .45s ease; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-12px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(6px); } }
  .lock-icon { font-size: 40px; margin-bottom: 12px; }
  .lock-card h2 { font-size: 26px; margin-bottom: 24px; color: #fff; letter-spacing: -0.01em; }
  .lock-card input {
    width: 100%; padding: 15px 20px; font-size: 17px; border-radius: 980px; text-align: center; color: #fff;
    background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.3); outline: none;
    transition: box-shadow .3s, border-color .3s;
  }
  .lock-card input::placeholder { color: rgba(255,255,255,0.6); }
  .lock-card input:focus { border-color: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,0.18), 0 0 30px rgba(142,92,255,0.7); }
  .lock-card button {
    margin-top: 16px; width: 100%; padding: 14px; font-size: 17px; border: none; border-radius: 980px;
    background: #fff; color: #1d1d1f; cursor: pointer; font-weight: 600; transition: transform .2s;
  }
  .lock-card button:hover { transform: scale(1.03); }
  .lock-card .err { color: #ffb3b8; font-size: 14px; min-height: 20px; margin-top: 14px; }
  body.locked > :not(#lock) { visibility: hidden; }
</style>
</head>
<body class="locked">

<div id="lock">
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
  <div class="lock-card" id="lockCard">
    <div class="lock-icon">&#128274;</div>
    <h2>Voer het wachtwoord in</h2>
    <input type="password" id="pw" placeholder="Wachtwoord" autocomplete="off">
    <button id="pwBtn">Openen</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<nav>
  <a href="index.html">Home</a>
  <a href="index.html#about">Over mij</a>
  <a href="gallery.html" class="active">Fotomuur</a>
  <a href="index.html#contact">Contact</a>
</nav>

<header>
  <h1 class="reveal">Fotomuur</h1>
  <p class="sub reveal">De momenten die ik wil bewaren</p>
</header>

<div class="grid">
  <img class="reveal" src="photos/1.jpg" alt="Foto 1">
  <img class="reveal" src="photos/2.jpg" alt="Foto 2">
  <img class="reveal" src="photos/3.jpg" alt="Foto 3">
  <img class="reveal" src="photos/4.jpg" alt="Foto 4">
  <img class="reveal" src="photos/5.jpg" alt="Foto 5">
  <img class="reveal" src="photos/6.jpg" alt="Foto 6">
</div>

<div id="lightbox"><img src="" alt=""></div>

<footer>© 2026 Mijn naam. Alle rechten voorbehouden.</footer>

<button id="music" title="Muziek afspelen">♪</button>
<audio id="bgm" src="music.mp3" loop></audio>

<script>
  // Wachtwoordbeveiliging (eenvoudig, alleen om bezoekers even tegen te houden)
  (function () {
    const PASSWORD = 'RP2026';
    const lock = document.getElementById('lock');
    const card = document.getElementById('lockCard');
    function open(animate) {
      document.body.classList.remove('locked');
      if (animate) { lock.classList.add('done'); setTimeout(() => { lock.style.display = 'none'; }, 800); }
      else { lock.style.display = 'none'; }
    }
    if (sessionStorage.getItem('unlocked') === 'yes') { open(false); return; }
    function check() {
      if (document.getElementById('pw').value === PASSWORD) {
        sessionStorage.setItem('unlocked', 'yes'); open(true);
      } else {
        document.getElementById('pwErr').textContent = 'Onjuist wachtwoord, probeer het opnieuw.';
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      }
    }
    document.getElementById('pwBtn').addEventListener('click', check);
    document.getElementById('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') check(); });
  })();

  // Scroll-animatie
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('show'); });
  }, { threshold: 0.15 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));

  // Klik om te vergroten
  const lb = document.getElementById('lightbox');
  const lbImg = lb.querySelector('img');
  document.querySelectorAll('.grid img').forEach(img => {
    img.addEventListener('click', () => { lbImg.src = img.src; lb.classList.add('open'); });
  });
  lb.addEventListener('click', () => lb.classList.remove('open'));

  // Muziekknop (onthoudt de afspeelpositie, zodat de muziek na een paginawissel doorgaat)
  const btn = document.getElementById('music');
  const bgm = document.getElementById('bgm');
  const t = parseFloat(sessionStorage.getItem('bgmTime') || '0');
  bgm.currentTime = t;
  setInterval(() => sessionStorage.setItem('bgmTime', bgm.currentTime), 500);
  btn.addEventListener('click', () => {
    if (bgm.paused) { bgm.play(); btn.textContent = '❚❚'; }
    else { bgm.pause(); btn.textContent = '♪'; }
  });
</script>

</body>
</html>
